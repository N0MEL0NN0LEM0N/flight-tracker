name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create & Configure Project
        run: |
          flutter create --org com.maple.radar --platforms android temp_app
          cp pubspec.yaml temp_app/pubspec.yaml
          cp lib/main.dart temp_app/lib/main.dart
          cp AndroidManifest.xml temp_app/android/app/src/main/AndroidManifest.xml
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maple-S3-Radar-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
